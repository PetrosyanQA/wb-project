# ─────────────────────────────────────────────────────────────────────────────
# WB յունիտ-էկոնոմիկայի պարամետրեր (FBO, 2026-ի բազային տարիֆներ)
# ⚠️ Տարիֆները WB-ն փոխում է հաճախ. ամեն ամիս ստուգիր WB կաբինետում
#    («Тарифы» բաժին) և MPStats-ի Юнит-калькулятор-ում, հետո թարմացրու այստեղ։
# ─────────────────────────────────────────────────────────────────────────────
scheme: FBO

commission_pct: 22.0          # WB միջնորդավճար՝ կատեգորիայից կախված 5–29.5%
acquiring_pct: 0.0            # WB-ի մոտ սովորաբար արդեն ներառված է կոմիսիայում

logistics:
  # <1 լ աստիճանակարգ (₽ 1 միավորի համար), 2026 բազա
  tiers_under_1l:
    0.200: 23
    0.400: 26
    0.600: 29
    0.800: 30
    1.000: 32
  first_liter_over_1l: 46     # >1 լ՝ առաջին լիտր
  extra_liter: 14             # >1 լ՝ յուրաքանչյուր հաջորդ լիտր
  warehouse_coef: 1.6         # պահեստի գործակից (100%–300%, տես կաբինետ)
  localization_index: 1.0     # ինդեքս լոկալիզացիայի
  return_cost_rub: 50         # հետադարձ լոգիստիկա 1 չգնված պատվերի համար

storage:
  per_liter_per_day: 0.07     # ₽/լ/օր (короб), × պահեստի գործակից
  warehouse_coef: 1.6
  avg_days_on_stock: 45       # պլանային պահեստավորման օրերը 1 միավորի համար

acceptance_per_liter: 1.7     # приёмка, ₽/լ × գործակից (հաճախ 0, եթե ազատ օր է)

operations:
  buyout_pct: 75.0            # % выкупа — ամենակարևոր փոփոխականը (հագուստում 30–45%)
  defect_loss_pct: 3.0        # կորուստ/բրակ/գողություն
  ad_share_of_revenue_pct: 12.0  # ДРР. ստարտին 15–25%, հետո 8–12%
  packaging_rub: 15           # փաթեթավորում + պիտակ 1 միավորի վրա
  first_mile_rub: 25          # մատակարարից մինչև WB պահեստ 1 միավորի վրա

tax:
  mode: revenue               # revenue (УСН 6%) | profit (УСН 15%)
  rate_pct: 6.0

targets:
  min_net_margin_pct: 18      # ցածրից՝ ապրանքը մերժում ենք
  min_roi_on_cost_pct: 60     # 1 շրջանառության ROI ինքնարժեքի վրա
