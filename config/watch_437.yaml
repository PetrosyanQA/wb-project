# Мониторинг кистей для макияжа (ниша 437) — src/brush_watch.py
# Конкуренты: наборы 1 000–1 800 ₽ из разбора 28–29.10.2026 (reports/vnutri_437_brushes_2026-10-28.md)
niche: 437
queries:                       # живая выдача WB (Saleflow wb_check_rates, 1 запрос на запрос)
  - "кисти для макияжа набор"
  - "набор кистей для макияжа"
  - "кисти для макияжа"
universe:                      # глубокий отчёт (src/brush_report.py): кого ещё брать из выдачи, кроме competitors
  max_skus: 40                 # всего карточек в отчёте (by_period = 1 запрос Saleflow на карточку, утром)
  top_positions: 60            # из первых N мест каждого запроса
  price_min: 700
  price_max: 3000
  name_include: "набор|кисти|кистей|шт"
  name_exclude: "спонж|щетк|щётк|органайзер|подставк для кистей|очистит|мыло"
our_cost_landed: 489           # себестоимость «под ключ» ТЕСТОВОЙ партии 100 шт: КП 306,5 (на 1 000) − доля фикса + добавки ≈ 40 [оценка] + 15 800 ₽ / 100; основная 300 шт ≈ 383 ₽
our_commission_pct: null       # null = из дампа WB API (src/commission.py); число — только если кабинет показал другое
our_batch: 100                  # тестовая партия (аудит 2026-11-01); основная 300 — после 3 условий
our_sales_plan_month: 92       # осторожный план продаж (P25 новичка, 1 100–1 700 ₽)
competitors:
  87445461: "MAGICAE 14 кистей + щёточка + коробка (лидер)"
  1186440287: "WISCORE 10 кистей + спонжи + повязка (новичок 07.2026)"
  732875676: "Misselision набор с косметичкой"
  157332878: "DaMiN 15 кистей + чехол-подставка"
  402678353: "MAANGE 13 кистей"
  391460159: "BEILI 12 кистей пудровые"
  978454551: "13 кистей + чехол (новичок 04.2026)"
  910307787: "YI BEAUTY 12 кистей"
  501226547: "MAANGE 13 кистей кофейные"
  158065316: "Laone 9 кистей + бархатный чехол"
our_skus: []                   # наши артикулы — добавить после создания карточки (⭐ в отчётах, тоже в дневном by_period)
actions_enabled: false        # true = бот по кнопке «Да» реально меняет цену в WB (нужен токен «Цены и скидки» и our_skus)
our_price_buyer: 1390         # наша цена для покупателя → СПП Evirma считаем для цены продавца = 1390 / (1 − СПП)
thresholds:
  price_pct: 3                 # сообщать об изменении цены от 3 %
  position: 10                 # сдвиг места в выдаче
  low_stock: 10                # остаток ≤ 10 шт
  price_drop_alert: 10         # ⚠️ конкурент снизил цену ≥ 10 % — проверить свою
  raise_price_min: 2           # 💡 «можно поднять цену», если у ≥ 2 конкурентов кончается товар
