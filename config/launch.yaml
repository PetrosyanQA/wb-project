# ЕДИНОЕ правило остановки (заменяет все прежние: 249, PROJECT_GUIDE, filters.yaml). Действует, если реклама шла ≥ 90 % дней и товар был в наличии.
kill_rules:
  day_14:
    - "отзывов < 8 или поисковых слов < 100 → сменить первый слайд/SEO, рекламу не выключать"
    - "CTR в рекламе ниже среднего ниши на 30 % → менять первый слайд"
  day_30:
    - "заказов < 3/день при ДРР ≤ 15 % → основную партию не заказываем, распродаём тестовую"
    - "рейтинг < 4,6 или ≥ 10 % отзывов про запах / линяние → стоп закупок, разбор с фабрикой"
    - "выкуп < 75 % → стоп закупок (упаковка, описание, размер набора)"
    - "сработали 2 из 3 правил дня 30 → товар закрываем, следующий из копилки"
  any_time:
    - "ДРР > 35 % 7 дней подряд → чистка слов и ставок; > 45 % 14 дней → пауза, пересмотр цены и фото"
    - "печать на ручках стирается (≥ 2 жалоб из первых 20) → стоп, претензия фабрике"
