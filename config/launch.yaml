# ЕДИНОЕ правило остановки (заменяет все прежние). Действует, только если реклама шла ≥ 90 % дней и товар был в наличии.
kill_rules:
  day_14:
    - "отзывов < 8 или поисковых слов < 100 → сменить фото/SEO, рекламу не выключать"
    - "CTR в рекламе ниже среднего ниши на 30 % → менять первый слайд"
  day_30:
    - "заказов < 1/день → стоп, распродать остаток"
    - "1–2 заказа/день → без большого дозаказа (максимум 150 шт)"
    - "≥ 2 заказов/день → дозаказ 250–300 шт к апрелю"
  any_time:
    - "ДРР > 35 % 7 дней подряд → чистка слов и ставок; > 45 % 14 дней → пауза, пересмотр цены и фото"
    - "конверсия в заказ < 3 % [допущение] → цена или контент"
    - "выкуп < 75 % 14 дней → упаковка/описание; < 70 % → стоп закупок"
    - "«порвалась» ≥ 2 из первых 20 отзывов или > 10 % негатива → стоп закупок, проверка стыка кольца"
