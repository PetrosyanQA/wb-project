# ─────────────────────────────────────────────────────────────────────────────
# ՖԻԼՏՐԵՐԻ ՇԱՐՔ — դասավորված ըստ ԱՐԺԵՔԻ. ամենաէժանը առաջինը։
# Ամեն դարպաս, որը ձախողվում է, կանգնեցնում է շղթան → չենք ծախսում API հարցումներ։
#
#   gate            API ծախս   ինչ է ստուգում
#   regulatory         0       Честный знак / սերտիֆիկացում / ԵԱՏՄ դեկլարացիա
#   economics          0       գին, ծավալ, լոգիստիկայի բաժին, break-even
#   concentration      1       տոպ-10 ≤ 40%, տոպ-1 ≤ 25%
#   yoy_peak           1       տարեկան դինամիկա ՊԻԿ ամսով (ոչ թե ամսական աղմուկ)
#   profile            0       «սարահարթ + շատ վաճառող + լուծելի բողոք»
#   audit              4+      SKU-ների խորը աուդիտ — ՄԻԱՅՆ ամենավերջում
# ─────────────────────────────────────────────────────────────────────────────

gate_order: [regulatory, economics, concentration, yoy_peak, profile, audit]

# ── 1. ԿԱՐԳԱՎՈՐՈՒՄ (0 հարցում) ───────────────────────────────────────────────
regulatory:
  allow_marking: false          # true = համաձայն ես աշխատել «Честный знак»-ի հետ
  allow_certification: false    # true = համաձայն ես սերտիֆիկատ/դեկլարացիա ձևակերպել
  # «Честный знак» (պարտադիր մարկավորում) — բանալի բառեր предмет/կատեգորիա անունում
  marking_keywords:
    [одежда, обув, бель, духи, парфюм, вода туалетная, шин, покрышк, фотоаппарат,
     молоч, вода упакованная, пиво, биолог, активн, добавк, бад, антисептик,
     медицинск, кресло-коляск, велосипед, икра, табак, никотин, лекарств, titul]
  # Սերտիֆիկացում/դեկլարացիա ԵԱՏՄ
  certification_keywords:
    [детск, игрушк, посуд, контактирующ, космет, крем, шампун, электро, зарядн,
     аккумулятор, светильник, провод, кабель, пищев, продукт, мебел, матрас,
     спорт инвентар, защитн, каск, респиратор, маск медицинск, текстил]
  # Երբեք չենք դիտարկում (անկախ ամեն ինչից)
  hard_exclude_keywords:
    [оружие, пиротехн, алкогол, ювелирн, драгоценн, лекарств, рецептурн]

# ── 2. ՏՆՏԵՍՈՒԹՅՈՒՆ (0 հարցում, հաշվարկ արդեն քաշված ագրեգատից) ──────────────
economics:
  price_min_rub: 1400           # ← բարձրացված՝ Երևանի իրական լոգիստիկայի պատճառով (71.3₽ ×1.55)
  price_max_rub: 2500
  volume_liters_max: 1.0        # ≤1 լ = էժան լոգիստիկա և պահեստավորում
  logistics_share_max: 0.25     # լոգիստիկա+պահեստավորում ≤ 25% գնից
  breakeven_below_median: true  # break-even գինը պետք է ցածր լինի նիշայի մեդիանից
  breakeven_margin_min: 0.15    # և առնվազն 15% պաշարով (break-even ≤ 0.85 × median)
  assumed_cost_share: 0.30      # ինքնարժեքի ենթադրություն գնից, քանի դեռ մատակարար չկա
  min_first_batch_units: 80
  budget_usd: 2000
  fx_rub_per_usd: 83.48      # ЦБ РФ 03.10.2026

# ── 3. ԿՈՆՑԵՆՏՐԱՑԻԱ (1 հարցում՝ տոպ-20 քարտ) ─────────────────────────────────
concentration:
  top10_share_max: 40.0         # ← նոր շեմ (նախկինում 78)
  top1_seller_share_max: 25.0   # ← նոր շեմ (նախկինում 45)
  min_sellers_in_top20: 8       # տոպ-20-ում քանի տարբեր վաճառող պետք է լինի
  max_one_brand_cards_in_top10: 4

# ── 4. ՏԱՐԵԿԱՆ ԴԻՆԱՄԻԿԱ ՊԻԿ ԱՄՍՈՎ (1 հարցում՝ 400 օր) ───────────────────────
yoy_peak:
  min_yoy_pct: -5.0             # պիկ ամիսը տարվա կտրվածքով չպետք է ընկնի >5%
  strong_yoy_pct: 15.0
  # «Պայթուցիկ» աճը նույնքան վտանգավոր է, որքան անկումը՝ այն սովորաբար
  # պահում է մեկ վաղ խաղացող, և նրա դեմ $2000-ով չես գնա
  explosive_yoy_pct: 80.0
  min_months_for_yoy: 13

# ── 5. ԹԻՐԱԽԱՅԻՆ ՊՐՈՖԻԼ — «սարահարթ + շատ վաճառող + լուծելի բողոք» ──────────
profile:
  name: plateau_with_complaint
  slope_min_pct_month: -1.5     # սարահարթ = գրեթե հորիզոնական
  slope_max_pct_month: 4.0
  min_sellers_total: 30         # բաշխված շուկա, ոչ թե մեկ խաղացողի
  max_top_seller_share: 25.0
  min_pct_sku_with_sales: 30.0
  rating_ceiling: 4.75          # ≥4.8 = գնորդը գոհ է, բարելավելու տեղ չկա
  min_complaint_share_pct: 12.0 # բացասական կարծիքների ≥12% մեկ ԸՆԴՀԱՆՈՒՐ թեմայի շուրջ
  complaint_themes:             # «լուծելի» բողոքներ — դրանք ապրանքի բարելավման կետեր են
    [не держит тепло, быстро остыва, протека, течет, запах, хлипк, ломает, трескает,
     мал, велик, не соответствует размер, тусклый, слабый, не держит заряд,
     неудобн, скользит, царапает, пачкает, крышка, резьба, сломал]
  reject_themes:                # «ոչ լուծելի» — դրանք քո խնդիրը չեն դառնա
    [долгая доставка, помят коробк, подмен, брак упаковк, не привезли]

# ── 6. ԱՈՒԴԻՏ (4+ հարցում 1 SKU-ի վրա) ───────────────────────────────────────
audit:
  sku_per_niche: 5              # 2 լիդեր + 1 միջին + 2 թարմ
  min_reviews_to_mine: 50

# ── Արտանետումների մաքրում (outliers) ────────────────────────────────────────
outliers:
  price_upper_ratio: 4.0        # գին > 4× մեդիան → դուրս (комплект/оптом)
  price_lower_ratio: 0.25       # գին < 0.25× մեդիան → դուրս (պարագա, ոչ թե ապրանք)
  min_days_with_sales: 2        # 1 օրվա պայթյուն = ակցիա/ինքնագնում, ոչ թե պահանջարկ
  drop_foreign_subject: true    # այլ предмет-ի տողերը դուրս են
  max_share_dropped_pct: 40     # եթե ավելի շատ է մաքրվում — տվյալը կասկածելի է
