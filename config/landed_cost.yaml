# Չինաստան → Հայաստան ներկրման ինքնարժեք (landed cost)
# Բոլոր շեմերը այստեղ են, ոչ թե կոդում։ Թարմացրու իրական գնանշումներով։

fx:
  # Փոխարժեքներ — թարմացնել ամիսը մեկ (cbr.ru / cba.am)
  cny_to_rub: 12.43         # 1 ¥ → ₽ (ЦБ РФ 03.10.2026: 12.4328)
  usd_to_rub: 83.48         # 1 $ → ₽ (ЦБ РФ 03.10.2026: 83.4839)
  amd_to_rub: 0.215         # 1 ֏ → ₽

freight:
  # Չինաստան → Երևան, $/կգ (ներառում է Գուանչժոու/Իու consolidation-ը)
  mode: truck               # air | truck | rail
  rates_usd_per_kg:
    air: 7.5                # 7-12 օր, թանկ, փոքր խմբաքանակի համար
    truck: 3.2              # 25-40 օր, ամենահաճախը
    rail: 2.6               # 35-50 օր, մեծ ծավալի համար
  min_charge_usd: 50        # նվազագույն վճար բեռնափոխադրման համար
  volumetric_divisor: 6000  # սմ³/կգ — ծավալային քաշը, եթե ապրանքը թեթև ու մեծ է

customs:
  # ԵԱՏՄ ներմուծման տուրք — կախված ТН ВЭД կոդից
  duty_pct: 8.0             # միջին 5-12%; ճշտել ըստ կոդի (alta.ru/tnved)
  vat_pct: 20.0             # ՀՀ ԱԱՀ ներմուծման պահին
  vat_recoverable: false    # true, եթե ԱԱՀ վճարող ես (միկրոբիզնեսի դեպքում false)
  broker_fee_usd: 120       # բրոքերի վճար մեկ խմբաքանակի համար
  customs_fee_usd: 30       # մաքսային ձևակերպման տուրք

batch:
  # Միավորի վրա բաշխվող ծախսերը կախված են խմբաքանակի չափից
  units: 300                # քանի՞ հատ ես բերում
  samples_usd: 60           # նմուշների պատվեր (պարտադիր՝ մինչև մեծ պատվերը)
  inspection_usd: 0         # QC ստուգում Չինաստանում (խորհուրդ՝ 80-120$ 1000$+ պատվերի դեպքում)
  defect_rate_pct: 3.0      # բրակ — միավորի ինքնարժեքը բարձրացնում է
