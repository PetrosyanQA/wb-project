# Конфиг цикла анализа (02.11.2026) — ЕДИНСТВЕННОЕ место дат, порогов, бюджетов и планки.
# Правило /analiz 0: пороги фиксируются ДО сбора данных; менять — только в новом цикле с уроком в learning/LESSONS.md.
data_month: "2026-07"            # последний проверенный месяц продаж Saleflow (fbs-check может сдвинуть на свежий)
newcomer_from: "2025-08-01"      # новичок = карточка, созданная в этом окне (≈ год до data_month)
newcomer_to: "2026-06-15"

banned_words: ["магнит"]         # единственный запрет пользователя; ЧЗ/документы/электроника — «оформить»
excluded_roots: ["одежд", "обувь", "белье"]

master:                          # src/niche_all.py — все ниши WB
  rev_min: 5000000               # выручка после возвратов, ₽/мес
  sellers_min: 30                # продавцов с продажами
  per_seller_min: 30             # продаж на продавца, шт/мес
  buyout_min: 60                 # %
  price_max: 7000
  price_premium: 700             # медиана ниже → «нужен премиум-сегмент»
  margin15_min: 10               # % при ДРР 15 %

pool:                            # src/niche_pool.py + src/screen_white.py — ценовые сегменты
  china_pct: 11.0                # ¥ = % цены покупателя [допущение до проверки 1688]
  ymax_ratio: 1.3                # потолок ¥ ≥ china_pct × это
  new_p50_min: 30                # медиана продаж новичка, шт/мес
  top1_max: 35                   # % продаж у одного продавца
  top6_max: 65                   # % у шести (оценивается при ≥ monopoly_min_cards карточек)
  monopoly_min_cards: 40
  winter_min: 0.6                # зимний спрос к июлю; неизвестен → «сезон ?» (не отсев)
  batch_min_units: 80
  min_month: 50000               # ₽/мес оценки — порог попадания в копилку

dossier:                         # src/dossier.py — ворота решения
  saleflow_budget: 10            # запросов Saleflow на одно досье
  loss_max: 10                   # % риска убытка (Монте-Карло)
  margin_spp18_min: 18           # % маржи при СПП 18 %, ДРР 15 %, партия 300
  margin_spp0_min: 0             # % маржи при СПП 0 %
  yuan_markup_check: 1.3         # экономика считается и при ¥ × это

budgets:
  saleflow_reserve: 50           # не опускать дневной остаток ниже
  brightdata_reserve: 100
  apify_min_usd: 0.5
  modes:                         # потолок расхода на прогон /analiz (Saleflow / Bright Data)
    check_current: [15, 5]
    boost_current: [10, 10]
    check_idea: [15, 5]
    search: [40, 20]

benchmark:                       # планка «лучше текущего товара» — считается тем же кодом досье
  sid: 437
  name: "кисти 437 премиум"
  price: 2690                    # цена покупателя, ₽
  yuan: 18                       # набор + чехол-стакан 2-в-1 (оценка 02.11)
