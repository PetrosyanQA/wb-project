# ─────────────────────────────────────────────────────────────────────────────
# Текущая схема бизнеса (с 2026-10-15): ИП Армения, FBS со «Своего склада РФ»
# (фулфилмент в Подмосковье), карго Китай → Москва без ГТД («белый ввоз» не рассматриваем — решение пользователя).
# Накладывается поверх config/unit_economics.yaml через unit_econ.load_scheme("am_fbs").
# tariffs_auto.yaml (СЦ Ереван) здесь НЕ применяется — это старая схема.
# Метки: [пользователь] — со слов пользователя; [факт] — WB API; [допущение] — до первого отчёта WB.
# ─────────────────────────────────────────────────────────────────────────────
scheme: AM_FBS_RF

acquiring_pct: 1.5              # [допущение] в еженедельном отчёте WB эквайринг — отдельная строка; уточнить по 1-му отчёту

logistics:
  ff_per_order_rub: 30          # [пользователь 2026-10-16] фулфилмент везёт заказ до пункта приёма WB, ₽ за отправку
  tiers_under_1l: {0.2: 78.2, 0.4: 78.2, 0.6: 78.2, 0.8: 78.2, 1.0: 78.2}   # [факт] WB API: тарифа < 1 л нет → 1-й литр
  first_liter_over_1l: 78.2     # [факт] WB API tariffs/box «Свой склад РФ» boxDeliveryMarketplaceBase, 2026-10-16 (коэф. 170 %)
  extra_liter: 23.8             # [факт] то же, boxDeliveryMarketplaceLiter
  warehouse_coef: 1.0
  localization_index: 1.0
  return_cost_rub: 50           # [допущение] обратная логистика за невыкупленный заказ

storage:                        # хранение у фулфилмента — внутри fixed_month_rub
  per_liter_per_day: 0.0
  warehouse_coef: 1.0
  avg_days_on_stock: 0
acceptance_per_liter: 0.0

fixed_month_rub: 0              # [пользователь 2026-10-16] фиксированной платы ФФ нет — только 30 ₽ за отправку

operations:
  ad_basis: orders              # ДРР как в кабинете WB = реклама / сумма ЗАКАЗОВ → на 1 продажу: ДРР × цена / выкуп
  packaging_rub: 50
  first_mile_rub: 25
  defect_loss_pct: 3.0

# НДС РФ для продавцов из ЕАЭС (ст. 174.3 НК РФ, с 01.07.2024; расчётная ставка 22/122 = 18,03 % с 2026).
# У продавцов из Армении WB выкупает товар через армянское юрлицо (выплата = цена × коэффициент − доставка) —
# вероятно, НДС уже внутри коэффициента. 0 — до письменного ответа WB [проверить]; сценарий «удерживают» = 18.03.
vat_ru_eaeu_pct: 0               # [пользователь 2026-10-22] с нас отдельно не удерживается — вопрос закрыт

tax:
  mode: revenue
  rate_pct: 10.0                # [пользователь 2026-10-15] ИП Армения 10 %; база = цена до СПП [допущение]

# ── Карго Китай → Москва (калькулятор YUANEXIM, прислал пользователь 2026-10-16) ─────────────────────────
# Формула калькулятора: итог $ = (вес коробки + вес упаковки) × тариф $/кг + объём коробки м³ × цена упаковки $/м³
# Проверка: (35 + 2) × 2,1 + 0,121 × 80 = 87,4 $ — совпадает с калькулятором.
cargo:
  route: "Уссурийск / Транзит"
  rate_usd_per_kg: 2.1          # [факт, калькулятор YUANEXIM 2026-10-16] — цена ДО фулфилмента в Подмосковье, без агентских % [пользователь]
  packaging: уголки
  packaging_types:
    уголки: {kg_per_carton: 2.0, usd_per_m3: 80}   # кг — [факт калькулятор]; $/м³ — [оценка] выведено (87,4 − 37 × 2,1) / 0,121
  carton_cm: [55, 50, 44]       # [факт, пример калькулятора]
  carton_max_kg: 35             # [факт, пример калькулятора]
  carton_fill: 0.85             # [допущение] доля объёма коробки, занятая товаром
  cny_to_rub: 12.43             # [факт] ЦБ РФ 03.10.2026 (config/landed_cost.yaml)
  usd_to_rub: 83.48             # [факт] ЦБ РФ 03.10.2026
  agent_pct: 0.0                # [пользователь 2026-10-16] процентов нет
  to_ff_rub_per_unit: 0         # [пользователь 2026-10-16] тариф карго уже включает доставку до ФФ
