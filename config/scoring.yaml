# ─────────────────────────────────────────────────────────────────────────────
# Մոդել՝ նիշա/ապրանք գնահատելու համար։ Փոխիր թվերը քո ռիսկի ախորժակի տակ։
# direction: up  = որքան մեծ, այնքան լավ | down = որքան փոքր, այնքան լավ
# bad / good  = 0 և 100 միավորի խարիսխները (գծային ինտերպոլացիա, clip 0..100)
# ─────────────────────────────────────────────────────────────────────────────
period_days: 30

budget:
  total_usd: 2000            # ընդհանուր մուտքի կապիտալ
  fx_rub_per_usd: 83.48      # ЦБ РФ 03.10.2026 (= landed_cost.yaml usd_to_rub)
  goods_share: 0.55          # որքանն է գնում ապրանքի առաջին խմբաքանակին
  ads_share: 0.25            # գովազդ/ինֆոգրաֆիկա/ֆոտո
  reserve_share: 0.20        # ռեզերվ (անսպասելի ծախսեր, երկրորդ խմբաքանակ)
  min_first_batch_units: 80  # ավելի քիչ խմբաքանակով քարտը չի «բռնկվում»

constraints:                 # կոշտ ֆիլտրեր. չբավարարողը դուրս է մնում
  price_min_rub: 1000        # ← նոր թիրախային միջանցք (ոչ ցածր՝ լոգիստիկայի պատճառով)
  price_max_rub: 2500
  max_cost_share_of_price: 0.35   # ինքնարժեքը ≤ 35% վաճառքի գնից
  min_niche_revenue_rub: 3000000  # 30 օրում նիշայի ընդհանուր շրջանառությունը
  max_niche_revenue_rub: 250000000 # չափից մեծ = խոշոր խաղացողների դաշտ
  max_top10_revenue_share: 40     # % տոպ-10 քարտի բաժինը (խստացված)
  min_pct_sku_with_sales: 25      # % քարտերի, որոնք վաճառք ունեն

metrics:
  revenue_per_selling_sku:        # ՄԵԴԻԱՆ եկամուտը 1 վաճառվող քարտի վրա, ₽/30օր
    direction: up
    bad: 25000
    good: 350000
    weight: 22
  pct_sku_with_sales:             # % քարտերի՝ վաճառքով. «փողը բաշխված է»
    direction: up
    bad: 25
    good: 70
    weight: 14
  top10_revenue_share:            # մոնոպոլիզացիա
    direction: down
    bad: 40                       # ← շեմը, որից վեր նիշան դուրս է
    good: 20
    weight: 14
  top_seller_share:               # ամենամեծ վաճառողի բաժինը
    direction: down
    bad: 25                       # ← շեմը
    good: 8
    weight: 10
  yoy_peak_pct:                   # ՊԻԿ ամիսը տարվա կտրվածքով (փոխարինեց ամսական աճին)
    direction: up                 # ամսական աճը աղմուկ է՝ սեզոնը խեղաթյուրում է այն
    bad: -10
    good: 20
    weight: 12
  plateau_fit:                    # 100 = սարահարթ (−1.5…+4 %/ամիս), 0 = անկում կամ պայթյուն
    direction: up
    bad: 0
    good: 100
    weight: 8
  median_comments_top:            # մուտքի բարիեր՝ տոպ-20-ի մեդիան կարծիքները
    direction: down
    bad: 900
    good: 60
    weight: 12
  new_sku_success_pct:            # % թարմ քարտերի (<120 օր) տոպ-50-ում
    direction: up
    bad: 4
    good: 30
    weight: 10
  price_fit_score:                # որքան է մեդիան գինը ընկնում բյուջեի միջանցք
    direction: up
    bad: 0
    good: 100
    weight: 8

red_flags:                        # ավտոմատ նախազգուշացումներ հաշվետվության մեջ
  top10_revenue_share: 40         # ← քո շեմը (նախկինում 78)
  top_seller_share: 25            # ← քո շեմը (նախկինում 45)
  median_comments_top: 800
  pct_sku_with_sales: 25          # ցածրից՝ վատ
  yoy_peak_pct: -10               # ցածրից՝ վատ (պիկ ամսով, ոչ թե ամսական)
  price_dispersion_ratio: 6       # p90/p10 գնի ցրվածություն
  fresh_low_pct: 5                # discover probe: 🟠 նոր քարտեր տոպ չեն մտնում
  fresh_high_pct: 25              # discover probe: 🟢 թարմ քարտերը բեկում են անում


# ─────────────────────────────────────────────────────────────────────────────
# Воронка отбора ниш (CLAUDE.md → Decision policy). Читает src/saleflow_eval.py.
# Профиль: «стабильная + слабые конкуренты». Дешёвые и самые отсекающие шаги — первыми.
# ─────────────────────────────────────────────────────────────────────────────
strategy:
  subject_revenue_min_rub: 30000000    # шаг 1: выручка subject за 30 дней
  subject_revenue_max_rub: 250000000
  price_min_rub: 800                   # шаг 1/3: медианная цена после чистки выбросов
  price_max_rub: 2500
  top1_max_pct: 25                     # шаг 2: один продавец — не больше (смягчено с 20, 2026-10-03)
  concentration_level_pct: 40          # шаг 2: «монополия» по правилу пользователя
  min_sellers_to_level: 5              # шаг 2: столько продавцов нужно, чтобы набрать 40%
  logistics_share_max_pct: 20          # шаг 3: логистика+возвраты+хранение, % цены
  volume_max_l: 4.0                    # шаг 3: объём упаковки (смягчено с 2.0, 2026-10-03)
  cost_ceiling_min_share: 0.25         # шаг 3: потолок себестоимости ≥ 25% медианной цены
  default_commission_pct: 22           # только если не передана реальная из wb_seller commission
  fresh_days: 365                      # шаг 3: «свежая» карточка
  min_fresh_in_top20: 2
  max_median_comments_top20: 1000
  outlier_price_mult: 5                # шаг 3: цена > 5× медианы — выброс
  min_days_with_sales: 3               # шаг 3: продажи меньше 3 дней — выброс
  min_dominant_subject_pct: 80         # шаг 3: меньше — путь это смешанная витрина, а не ниша
  yoy_min_pct: -10                     # шаг 4: пиковый месяц год к году (смягчено с -5, 2026-10-03)
  rolling12_min_pct: -10               # шаг 4: последние 12 мес к предыдущим 12
  flat_season_amplitude_pct: 15        # шаг 4: ниже — сезонности нет, судим по 12 мес
  min_full_peaks: 3                    # шаг 4: меньше — «мало истории»
  min_points_per_month: 3
  forecast_tail_days: 7                # шаг 4: отрезаем прогнозный хвост forecast/trend
  complaints_window_days: 365          # шаг 5
  complaint_min_share_pct: 10
  complaint_min_leaders: 2
  complaint_min_negatives: 30

  regulatory:                          # шаг 0: ищется в ПОСЛЕДНЕМ сегменте пути (предмет)
    allow_marking: true                # [пользователь 2026-11-01] запрет только магниты; ЧЗ/декларация → пометка «что оформить», не отсев
    # Неполный список «Честный знак» — эвристика. Финально сверять на честныйзнак.рф.
    block_keywords: [обувь, кроссовк, ботин, сапог, туфл, кед, футболк, плать, брюк, джинс,
                     куртк, пальто, пуховик, свитер, худи, рубашк, юбк, белье, бельё, носк,
                     колгот, полотенц, постельн, простын, наволоч, пододеяльн, парфюм, духи,
                     туалетная вода, космет, шампун, крем, бытовая хими, стиральн, бады,
                     биологически активн, витамин, питьевая вода, молоч, сыр, шины, фотоаппарат,
                     вспышк, пиво, табак, сигарет, никотин, лекарств, кресла-коляск, корм]
    declaration_keywords: [посуд, термос, кружк, термокружк, бутылк, ланч, контейнер, игрушк, детск,
                           электр, зарядн, ламп, фонар, компрессор]
    allow_keywords: [кормушк]          # слова, которые похожи на запрещённые основы, но не маркируются
    # Однословные основы проверяются по НАЧАЛУ слова («носк» не ловит «переноска»), фразы — подстрокой.
    declaration_extra_rub: 10000

  complaint_themes:                    # шаг 5: основы слов (нижний регистр)
    брак_поломка: [брак, слома, сломан, трещин, треснул, лопнул, отвалил, разбит]
    не_держит_тепло: [держит тепл, держит темп, остыва, теплоизол, не греет]
    протекает: [теч, протека, подтека]
    застёжка_магнит: [магнит, застеж, застёж, не закрыва, не фиксир, замок]
    размер: [размер, маленьк, большеват, не подош, не влез]
    запах: [запах, воня, пахнет]
    хлипкий_материал: [тонк, хлипк, дешев, дешёв, прогнул, гнёт, гнет]
    упаковка_доставка: [упаков, помят, мятая, вмятин, коробк, погнут]
    не_как_на_фото: [не соответств, не как на фото, другой цвет, не тот цвет, описани, меньше, мельче, крошечн]
    аллергия_кожа: [аллерг, покраснел, раздраж, зуд, сыпь, ожог, почернела кож, чернит кож, позеленел]
    потемнело_слезло: [потемнел, почернел, слез, облез, стерл, тускн, позолот, покрыти, окислил, ржав]
    ломается_застёжка: [сломал, обломал, оторвал, отпал, отвалил, замок, крючок, застёжк, застежк, расстегн, порвал]
    комплектность: [не хватает, не было, не положили, одна серьг, пришла одна, разные, не парн, не одинаков]
    не_вакуумирует: [вакуумир, вакумир, вокумир, вакуммир, откачив, выкачив, вытягивает воздух, только запаив, только паяет, не создаёт вакум, не создает вакум, пропускает воздух]
    клей_плохой: [клей, клея, не клеит, не держит клей]
    подсветка_батарейки: [подсвет, батарейк, батареек, гирлянд, свет не]
    инструкция_язык: [инструкц, на английск, на китайск, не на русск, непонятн]
    швы_ручки_рвутся: [порвал, рвёт, рвет, шов, швы, ручка оторв, оторвал, распорол, лямк]
    часы_встают_отстают: [встал, встают, отста, останавлива, не ход, перестали ход, перестали работ, стрелк, батарейк, батарея, боторейк]
    перестал_работать: [перестал работ, не включ, перестал откач, перестал вакуум, на третий раз, через месяц, нерабоч, не рабоч]
    # электроника (камеры, видеоняни, видеоглазки) — добавлено 2026-10-04
    подключение_приложение: [подключ, приложени, wi-fi, wifi, вайфай, не коннект, отваливается, теряет связь, пропадает связь, зарегистрир, сопряж, не видит сеть]
    аккумулятор_заряд: [аккумулятор, разряж, заряд не держ, быстро садится, держит заряд]
    качество_картинки: [мутн, размыт, зернист, пиксел, качество изображ, качество видео, ночью не видно, ночное видение плох, засвет]
    язык_голос: [на китайском, на английском, нерусском, не на русском, китайский голос, громко говорит, голос]
    крепеж_установка: [винт, болт, толщин, не подошл, крепеж, крепёж, установить не]
    сигнал_дальность: [сигнал, дальност, через стен, помех, теряет связ, обрыв, не ловит, вне зоны, рябит]
    экран_маленький: [маленький экран, экран маленьк, мелкий экран, маленький монитор, экран мал]
    шум_писк: [треск, пищит, писк, шипит, шипение, гудит, фонит]
