name: daily-check
on:
  # 2026-10-29: расписание выключено по просьбе пользователя (уведомления по нише 249 больше не нужны);
  # мониторинг кистей 437 — .github/workflows/watch437.yml. Ручной запуск оставлен.
  workflow_dispatch: {}      # кнопка «Run workflow» для ручного запуска
permissions:
  contents: write            # чтобы сохранить cloud_state/last.json
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - name: Ежедневная проверка
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WB_TOKEN_PERSONAL: ${{ secrets.WB_TOKEN_PERSONAL }}
        run: python -m src.cloud_daily
      - name: Сохранить состояние
        run: |
          git config user.name "daily-check"
          git config user.email "actions@users.noreply.github.com"
          git add cloud_state/last.json
          git diff --cached --quiet || git commit -m "cloud state $(date -u +%F)"
          git push
